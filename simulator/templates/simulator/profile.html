{% extends 'simulator/account_base.html' %}
{% block title %}Display name{% endblock %}
{% block content %}
<h1 id="account-title">Display name</h1>
<p class="account-note">Login username: <strong>{{ user.username }}</strong></p>
{% if saved %}<p role="status">Your display name has been saved.</p>{% endif %}
<form method="post" action="{% url 'profile' %}">
  {% csrf_token %}{% include 'simulator/account_fields.html' %}
  <button class="start-button" type="submit">Save display name</button>
</form>
{% endblock %}
