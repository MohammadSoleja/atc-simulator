{% extends 'simulator/account_base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<h1 id="account-title">Reset password</h1>
<p class="account-note">Enter your account’s email address. If an eligible account matches, we’ll send a reset link.</p>
<form method="post">
  {% csrf_token %}{% include 'simulator/account_fields.html' %}
  <button class="start-button" type="submit">Send reset link</button>
</form>
{% endblock %}
